name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请描述清楚要解决的问题，而不只是解决方案本身。
  - type: textarea
    id: problem
    attributes:
      label: 需求描述
      description: 你要解决什么问题？目前的痛点是什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你希望这个功能如何工作？
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案（可选）
      description: 你考虑过的其他方案或变通办法。
  - type: textarea
    id: context
    attributes:
      label: 使用场景（可选）
      description: 谁会在什么场景下受益？
